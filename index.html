
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Maker</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;padding:20px}
main{max-width:900px;margin:auto}
h1{font-size:24px}
textarea,input,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #444;background:#222;color:white}
textarea{width:100%;resize:vertical}
button{cursor:pointer}
button:hover{background:#444}
.primary{background:#6750a4;border:0}
#script{height:180px}
#scenes{display:grid;gap:12px;margin-top:20px}
.scene{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;background:#202020;border-radius:12px}
.preview{width:110px;aspect-ratio:9/16;background:#333;object-fit:cover;border-radius:8px}
.scene textarea{height:75px}
.scene input{width:100%;margin-top:8px}
.scene button{margin-top:8px}
#canvas{width:100%;max-width:360px;aspect-ratio:9/16;background:#000}
#status{color:#aaa;font-size:14px}
#login{max-width:420px;margin:100px auto;text-align:center}
#app{display:none}
#user{font-size:14px;color:#aaa}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<div id="login">
  <h1>Shorts Maker</h1>
  <p>관리자 전용 숏츠 제작 사이트</p>
  <button class="primary" onclick="loginWithGoogle()">Google 로그인</button>
  <p id="loginStatus"></p>
</div>

<main id="app">
  <h1>Shorts Maker</h1>
  <p id="user"></p>
  <button onclick="logout()">로그아웃</button>

  <h2>대본</h2>
  <textarea id="script" placeholder="숏츠 대본을 여기에 붙여넣어"></textarea>
  <p><button class="primary" onclick="makeScenes()">장면 나누기</button></p>

  <div id="scenes"></div>

  <hr>
  <h2>영상 미리보기</h2>
  <canvas id="canvas" width="720" height="1280"></canvas>
  <br>
  <button class="primary" onclick="renderVideo()">영상 만들기</button>
  <p id="status"></p>
  <video id="video" controls hidden style="width:100%;max-width:360px"></video>
  <br>
  <a id="download" hidden>영상 다운로드</a>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAxknDZq8Cl4ADKvlg0pToWEFA6WY94H00",
  authDomain: "making-shorts-577ce.firebaseapp.com",
  projectId: "making-shorts-577ce",
  storageBucket: "making-shorts-577ce.firebasestorage.app",
  messagingSenderId: "952212878867",
  appId: "1:952212878867:web:6490fb2ed9fff9d5df31e6",
  measurementId: "G-5RJ81Y6TKP"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const ADMIN_EMAIL = "raizn199x@gmail.com";

function loginWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(error=>{
    document.getElementById("loginStatus").textContent =
      "로그인 실패: " + error.message;
  });
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(async user=>{
  if(user && user.email === ADMIN_EMAIL && user.emailVerified){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("user").textContent=user.email;
  }else{
    document.getElementById("app").style.display="none";
    document.getElementById("login").style.display="block";

    if(user){
      await auth.signOut();
      document.getElementById("loginStatus").textContent=
        "관리자 계정만 로그인할 수 있어.";
    }
  }
});

const scenes = [];
const $ = id => document.getElementById(id);

function makeScenes(){
  const text=$("script").value.trim();
  if(!text)return alert("대본을 먼저 넣어줘.");

  scenes.length=0;

  const sentences=text.replace(/\n+/g," ").match(/[^.!?。]+[.!?。]?/g)||[];

  sentences.forEach(sentence=>{
    const caption=sentence.trim();
    if(caption)scenes.push({caption,image:null,search:caption});
  });

  showScenes();
}

function showScenes(){
  $("scenes").innerHTML="";

  scenes.forEach((scene,i)=>{
    const card=document.createElement("div");
    card.className="scene";
    card.innerHTML=`
      <img class="preview" id="img${i}">
      <div>
        <textarea id="cap${i}"></textarea>
        <input id="search${i}" placeholder="이미지 검색어">
        <button onclick="searchImage(${i})">이미지 검색</button>
        <input type="file" accept="image/*" onchange="loadImage(event,${i})">
      </div>`;

    $("scenes").appendChild(card);
    $("cap"+i).value=scene.caption;
    $("search"+i).value=scene.search;
  });
}

function searchImage(i){
  window.open(
    "https://www.google.com/search?tbm=isch&q="+
    encodeURIComponent($("search"+i).value),
    "_blank"
  );
}

function loadImage(event,i){
  const file=event.target.files[0];
  if(!file)return;

  const url=URL.createObjectURL(file);
  const img=new Image();

  img.onload=()=>{
    scenes[i].image=img;
    $("img"+i).src=url;
  };
  img.src=url;
}

function drawScene(i){
  const canvas=$("canvas");
  const ctx=canvas.getContext("2d");
  const scene=scenes[i];

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,720,1280);

  if(scene.image){
    const img=scene.image;
    const scale=Math.max(720/img.width,1280/img.height);
    const w=img.width*scale;
    const h=img.height*scale;
    ctx.drawImage(img,(720-w)/2,(1280-h)/2,w,h);
  }

  ctx.fillStyle="rgba(0,0,0,.72)";
  ctx.fillRect(0,920,720,360);

  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="bold 48px sans-serif";

  const caption=$("cap"+i).value;
  const words=caption.split(" ");
  const lines=[];
  let line="";

  words.forEach(word=>{
    const test=line+word+" ";
    if(ctx.measureText(test).width>640){
      lines.push(line);
      line=word+" ";
    }else line=test;
  });

  if(line)lines.push(line);

  const lineHeight=65;
  const startY=1100-(lines.length-1)*lineHeight/2;

  lines.forEach((text,j)=>{
    ctx.fillText(text.trim(),360,startY+j*lineHeight);
  });
}

async function renderVideo(){
  if(!scenes.length)return alert("먼저 대본을 넣어줘.");
  if(!scenes.some(s=>s.image))return alert("이미지를 하나 이상 넣어줘.");

  const canvas=$("canvas");
  const stream=canvas.captureStream(30);

  if(!window.MediaRecorder)return alert("이 브라우저는 영상 녹화를 지원하지 않아.");

  const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
    ?"video/webm;codecs=vp9":"video/webm";

  const recorder=new MediaRecorder(stream,{mimeType:mime});
  const chunks=[];

  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/webm"});
    const url=URL.createObjectURL(blob);

    $("video").src=url;
    $("video").hidden=false;
    $("download").href=url;
    $("download").download="shorts.webm";
    $("download").hidden=false;
    $("download").textContent="영상 다운로드";
    $("status").textContent="영상 제작 완료!";
  };

  recorder.start();

  for(let i=0;i<scenes.length;i++){
    drawScene(i);
    $("status").textContent=`영상 제작 중... ${i+1}/${scenes.length}`;
    await new Promise(resolve=>setTimeout(resolve,4000));
  }

  recorder.stop();
}
</script>
</body>
</html>
