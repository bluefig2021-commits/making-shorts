<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>숏츠 타임라인 편집기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#eee;font:14px system-ui,sans-serif}header{padding:14px 20px;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,label,.pill{background:#292d36;color:#eee;border:1px solid #454b58;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover,label:hover{background:#383e49}input,select,textarea{background:#1b1e25;color:#eee;border:1px solid #454b58;border-radius:6px;padding:7px;max-width:100%}main{display:grid;grid-template-columns:minmax(260px,1fr) 360px;gap:16px;padding:16px}.preview{display:grid;place-items:center;background:#090a0d;border:1px solid #30343d;border-radius:12px;min-height:540px}canvas{width:min(100%,360px);height:auto;max-height:78vh;aspect-ratio:9/16;background:#000}.panel{background:#191c23;border:1px solid #30343d;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=number]{width:85px}.timeline{margin:0 16px 16px;background:#191c23;border:1px solid #30343d;border-radius:12px;padding:14px;overflow:auto}.track{position:relative;height:44px;background:#101218;border-radius:6px;margin:8px 0 14px;min-width:600px}.block{position:absolute;top:4px;height:36px;border-radius:5px;padding:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;background:#315d8c;border:1px solid #7ab7f5}.block.caption{background:#765126;border-color:#e5b66a}.muted{color:#9aa2b0;font-size:12px}h3{margin:0 0 4px}.hidden{display:none}@media(max-width:800px){main{grid-template-columns:1fr}.preview{min-height:0}}
</style>
</head>
<body>
<header>
<strong>숏츠 타임라인 편집기</strong>
<label>이미지/영상 추가 <input id="files" type="file" accept="image/*,video/*" multiple hidden></label>
<button id="addCaption">자막 추가</button>
<button id="play">▶ 재생</button>
<button id="export">WebM 내보내기</button>
<span id="status">미디어를 추가해 시작해</span>
</header>

<main>
<section class="preview"><canvas id="canvas" width="720" height="1280"></canvas></section>
<section class="panel">
<h3>선택한 클립</h3>
<div id="empty" class="muted">타임라인의 클립을 선택해 편집해.</div>
<div id="editor" class="hidden">
<label id="kind"></label>
<div class="row">시작 <input id="start" type="number" min="0" step=".1">초</div>
<div class="row">길이 <input id="duration" type="number" min=".1" step=".1">초</div>
<div id="captionFields" class="hidden">
<textarea id="text" rows="3" placeholder="자막 내용"></textarea>
<div class="row">크기 <input id="fontSize" type="number" min="12" max="120"></div>
<div class="row">위치
<select id="position"><option value="top">위</option><option value="middle">가운데</option><option value="bottom">아래</option></select>
색 <input id="color" type="color" value="#ffffff">
</div>
</div>
<button id="delete">선택 클립 삭제</button>
</div>
<div class="muted">영상 파일도 올릴 수 있어. 현재 내보내기는 영상 소리 없이 WebM으로 저장돼.</div>
</section>
</main>

<section class="timeline">
<div class="row"><strong>미디어 트랙</strong><span class="muted">파란 클립</span></div>
<div id="mediaTrack" class="track"></div>
<div class="row"><strong>자막 트랙</strong><span class="muted">갈색 클립</span></div>
<div id="captionTrack" class="track"></div>
<div class="muted">클립을 눌러 선택. 시작/길이는 오른쪽에서 수정 가능.</div>
</section>

<script>
const $=id=>document.getElementById(id), cv=$('canvas'),ctx=cv.getContext('2d');
let media=[],caps=[],selected=null,playing=false,origin=0,raf=0,clock=0,assets=[];

function total(){
  return Math.max(5,...media.map(x=>x.start+x.duration),...caps.map(x=>x.start+x.duration));
}

function addAsset(file){
  const url=URL.createObjectURL(file);
  const el=file.type.startsWith('video/')?document.createElement('video'):new Image();
  el.src=url;
  if(el.tagName==='VIDEO'){
    el.muted=true;el.loop=true;el.playsInline=true;
  }
  const item={
    id:crypto.randomUUID(),
    name:file.name,
    start:media.length?Math.max(...media.map(x=>x.start+x.duration)):0,
    duration:5,url,el
  };
  media.push(item);assets.push(url);select(item);render();
}

$('files').onchange=e=>{
  [...e.target.files].forEach(addAsset);
  e.target.value='';
};

$('addCaption').onclick=()=>{
  const c={
    id:crypto.randomUUID(),text:'자막을 입력해',
    start:clock,duration:3,size:54,pos:'bottom',color:'#ffffff'
  };
  caps.push(c);select(c);render();
};

function select(item){
  selected=item;
  $('empty').classList.toggle('hidden',!!item);
  $('editor').classList.toggle('hidden',!item);
  if(!item)return;

  $('kind').textContent=media.includes(item)?'미디어: '+item.name:'자막 클립';
  $('start').value=item.start;
  $('duration').value=item.duration;
  $('captionFields').classList.toggle('hidden',media.includes(item));

  if(caps.includes(item)){
    $('text').value=item.text;
    $('fontSize').value=item.size;
    $('position').value=item.pos;
    $('color').value=item.color;
  }
}

function update(){
  if(!selected)return;
  selected.start=Math.max(0,+$('start').value||0);
  selected.duration=Math.max(.1,+$('duration').value||.1);

  if(caps.includes(selected)){
    selected.text=$('text').value;
    selected.size=+$('fontSize').value||54;
    selected.pos=$('position').value;
    selected.color=$('color').value;
  }
  render();draw(clock);
}

['start','duration','text','fontSize','position','color'].forEach(id=>{
  $(id).addEventListener('input',update);
});

$('delete').onclick=()=>{
  if(!selected)return;
  media=media.filter(x=>x!==selected);
  caps=caps.filter(x=>x!==selected);
  select(null);render();draw(clock);
};

function block(item,isCap,track){
  const b=document.createElement('div');
  b.className='block'+(isCap?' caption':'');
  b.style.left=(item.start/total()*100)+'%';
  b.style.width=Math.max(2,item.duration/total()*100)+'%';
  b.textContent=isCap?item.text:item.name;
  b.title='선택';
  b.onclick=()=>select(item);
  track.append(b);
}

function render(){
  $('mediaTrack').innerHTML='';
  $('captionTrack').innerHTML='';
  media.forEach(x=>block(x,false,$('mediaTrack')));
  caps.forEach(x=>block(x,true,$('captionTrack')));
}

function draw(t){
  clock=t;
  ctx.fillStyle='#05070b';
  ctx.fillRect(0,0,720,1280);

  const m=media.find(x=>t>=x.start&&t<x.start+x.duration);
  if(m&&m.el){
    const el=m.el;
    if(el.tagName==='VIDEO'&&Math.abs(el.currentTime-(t-m.start))>.35){
      try{el.currentTime=Math.max(0,t-m.start)}catch(e){}
    }
    if(el.tagName==='VIDEO'&&el.readyState<2)el.play().catch(()=>{});
    if(el.tagName==='IMG'&&el.complete)paint(el);
    if(el.tagName==='VIDEO'&&el.readyState>=2)paint(el);
  }

  caps.filter(c=>t>=c.start&&t<c.start+c.duration).forEach(c=>{
    ctx.font=`700 ${c.size}px Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    const lines=wrap(c.text,600);
    let y=c.pos==='top'?170:c.pos==='middle'?640:1080;
    lines.forEach((line,i)=>{
      const yy=y+(i-(lines.length-1)/2)*c.size*1.25;
      ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,.8)';
      ctx.strokeText(line,360,yy);
      ctx.fillStyle=c.color;ctx.fillText(line,360,yy);
    });
  });
}

function paint(el){
  const sw=el.videoWidth||el.naturalWidth||720;
  const sh=el.videoHeight||el.naturalHeight||1280;
  const scale=Math.max(720/sw,1280/sh);
  const w=sw*scale,h=sh*scale;
  ctx.drawImage(el,(720-w)/2,(1280-h)/2,w,h);
}

function wrap(text,max){
  let words=text.split(' '),lines=[],line='';
  for(const w of words){
    if(ctx.measureText(line+' '+w).width>max&&line){lines.push(line);line=w}
    else line+=(line?' ':'')+w;
  }
  if(line)lines.push(line);
  return lines;
}

$('play').onclick=()=>{
  playing=!playing;
  if(playing){
    origin=performance.now()-clock*1000;
    $('play').textContent='Ⅱ 정지';
    tick();
  }else{
    $('play').textContent='▶ 재생';
    cancelAnimationFrame(raf);
  }
};

function tick(){
  if(!playing)return;
  clock=(performance.now()-origin)/1000;
  draw(clock);
  if(clock>=total()){
    playing=false;$('play').textContent='▶ 재생';return;
  }
  raf=requestAnimationFrame(tick);
}

$('export').onclick=()=>{
  const stream=cv.captureStream(30);
  const rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='shorts.webm';a.click();
    $('status').textContent='내보내기 완료';
  };

  clock=0;draw(0);rec.start();
  $('status').textContent='렌더링 중…';
  const end=total(),start=performance.now();

  function frame(){
    clock=(performance.now()-start)/1000;
    draw(clock);
    if(clock<end)requestAnimationFrame(frame);
    else rec.stop();
  }
  frame();
};

draw(0);
</script>
</body>
</html>
